name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing exchanges this OIDC token for a scoped publish credential
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: bun install
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: just pack
      - run: bunx playwright install chromium --with-deps
      - run: bun scripts/pack-e2e.ts
      - name: publish npm packages via trusted publishing
        run: |
          (cd clients/web && npm publish)
          (cd packages/dslab && npm publish)
          (cd packages/slab && npm publish)
      - run: just editors
      - name: attach editor plugins to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/editors/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
