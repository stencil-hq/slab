[workspace]
members = [
   "crates/slab-abi",
   "crates/slab-cli",
   "crates/slab-compile",
   "crates/slab-drive",
   "crates/slab-fonts",
   "crates/slab-kernel",
   "crates/slab-kernel-wasm",
   "crates/slab-lsp",
   "crates/slab-macro",
   "crates/slab-native",
   "crates/slab-ratatui",
   "crates/slab-slir",
   "crates/slab-syntax",
   "crates/slab-tui",
   "crates/slab-wasm",
   "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
homepage = "https://stencil.so/"
repository = "https://github.com/stencil-hq/slab"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false
strip = "symbols"
split-debuginfo = "off"

[profile.local]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = false

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
incremental = true
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Deps compile optimized once and cache; your own crates stay fast.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"

[workspace.lints.rust]
# ──────────────────────────────────────────────────────────────────────────────
# Rust Lint Levels
# ──────────────────────────────────────────────────────────────────────────────
mismatched_lifetime_syntaxes = "allow"

[workspace.lints.clippy]
# ──────────────────────────────────────────────────────────────────────────────
# Base Lint Levels
# ──────────────────────────────────────────────────────────────────────────────
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# ──────────────────────────────────────────────────────────────────────────────
# Meta: Lint Attributes
# ──────────────────────────────────────────────────────────────────────────────
allow_attributes_without_reason = "warn" # Enforce reason for all #[allow]

# ──────────────────────────────────────────────────────────────────────────────
# Safety & Unsafe Code
# ──────────────────────────────────────────────────────────────────────────────
borrow_as_ptr = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
undocumented_unsafe_blocks = "warn"
unsafe_derive_deserialize = "allow"

# ──────────────────────────────────────────────────────────────────────────────
# Numeric Casts & Conversions
# ──────────────────────────────────────────────────────────────────────────────
cast_lossless = "allow"            # u32 as u64 - 'as' is cleaner than From
cast_possible_truncation = "allow" # u64 as u32 - often intentional
cast_possible_wrap = "allow"       # u32 as i32 - can be intentional
cast_precision_loss = "allow"      # f64 as f32 - sometimes acceptable
cast_sign_loss = "allow"           # i32 as u32 - sometimes needed
tuple_array_conversions = "allow"  # Non-Into conversion is more clear

# ──────────────────────────────────────────────────────────────────────────────
# Floating Point
# ──────────────────────────────────────────────────────────────────────────────
float_cmp = "allow" # Tests mostly do this + we know what we're doing

# ──────────────────────────────────────────────────────────────────────────────
# Functions & Closures
# ──────────────────────────────────────────────────────────────────────────────
inline_always = "allow"                      # Needed for performance-critical code
must_use_candidate = "allow"                 # Not every function needs #[must_use]
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow" # .map(ToString::to_string) can be clearer
return_self_not_must_use = "allow"           # Builder pattern methods

# ──────────────────────────────────────────────────────────────────────────────
# Structs & Types
# ──────────────────────────────────────────────────────────────────────────────
inconsistent_struct_constructor = "allow"
missing_fields_in_debug = "allow"         # Not every field needs to be in Debug output
struct_excessive_bools = "allow"          # Usually with builders

# ──────────────────────────────────────────────────────────────────────────────
# Pattern Matching
# ──────────────────────────────────────────────────────────────────────────────
match_same_arms = "allow"                    # Can be intentional for clarity
match_wildcard_for_single_variants = "allow" # _ can be clearer than listing variants
option_if_let_else = "allow"                 # match/if-let-else often clearer

# ──────────────────────────────────────────────────────────────────────────────
# Imports & Module Organization
# ──────────────────────────────────────────────────────────────────────────────
enum_glob_use = "allow"
items_after_statements = "allow" # Sometimes more readable
wildcard_imports = "allow"       # Cleaner for preludes and test modules

# ──────────────────────────────────────────────────────────────────────────────
# Variables & Type Inference
# ──────────────────────────────────────────────────────────────────────────────
let_underscore_untyped = "allow" # Type obvious from context
many_single_char_names = "allow" # Math and coordinate single-letter variable names are standard
similar_names = "allow"          # 'req' and 'res' together are fine
# ──────────────────────────────────────────────────────────────────────────────
# Literals & Formatting
# ──────────────────────────────────────────────────────────────────────────────
unreadable_literal = "allow" # 10_000_000 vs 0xDEADBEEF is context dependent
verbose_bit_mask = "allow"   # Explicit bit patterns can be clearer than hex

# ──────────────────────────────────────────────────────────────────────────────
# Code Style
# ──────────────────────────────────────────────────────────────────────────────
default_trait_access = "allow"        # Default::default() sometimes clearer
significant_drop_tightening = "allow" # We pay attention to this already

# ──────────────────────────────────────────────────────────────────────────────
# Documentation
# ──────────────────────────────────────────────────────────────────────────────
missing_errors_doc = "allow" # Documenting every error return is often redundant
missing_panics_doc = "allow" # Not every panic needs docs, especially assert!

# ──────────────────────────────────────────────────────────────────────────────
# Complexity
# ──────────────────────────────────────────────────────────────────────────────
too_many_arguments = "allow" # Argument count is rarely the real complexity signal
too_many_lines = "allow"     # Arbitrary limits don't account for necessary complexity

[workspace.dependencies]

# ──────────────────────────────────────────────────────────────────────────────
# Internal Workspace Crates
# ──────────────────────────────────────────────────────────────────────────────
slab-abi = { path = "crates/slab-abi" }
slab-cli = { path = "crates/slab-cli" }
slab-compile = { path = "crates/slab-compile" }
slab-drive = { path = "crates/slab-drive" }
slab-fonts = { path = "crates/slab-fonts" }
slab-kernel = { path = "crates/slab-kernel" }
slab-kernel-wasm = { path = "crates/slab-kernel-wasm" }
slab-lsp = { path = "crates/slab-lsp" }
slab-macro = { path = "crates/slab-macro" }
slab-native = { path = "crates/slab-native" }
slab-ratatui = { path = "crates/slab-ratatui" }
slab-slir = { path = "crates/slab-slir" }
slab-syntax = { path = "crates/slab-syntax" }
slab-tui = { path = "crates/slab-tui" }
slab-wasm = { path = "crates/slab-wasm" }
xtask = { path = "crates/xtask" }

# ──────────────────────────────────────────────────────────────────────────────
# External Dependencies
# ──────────────────────────────────────────────────────────────────────────────
ab_glyph = "0.2"
accesskit = "0.24.1"
accesskit_winit = "0.33.2"
anyhow = "1"
arboard = { version = "3.6.1", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
crossterm = "0.29"
logos = "0.16"
lyon = "1"
png = "0.18"
pollster = "1.0"
prost = "0.14"
minijinja = "2"
prost-build = "0.14"
protox = "0.9"
ratatui = "0.29"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
snap = "1"
tiny-skia = "0.12"
ttf-parser = "0.25"
wasm-bindgen = "0.2"
wgpu = "30"
winit = "0.30"
