# Platform × feature support chart — single source of truth (audited against
# the drivers as built: clients/web painter.ts/element.ts,
# crates/slab-native renderer.rs/demo.rs, crates/slab-kernel/src/cells.rs +
# crates/slab-tui, and crates/slab-compile svg.rs/raster.rs).
# Values: "full" | "degraded:<one concrete sentence>" | "none:<cap-* diag code>"
# Columns: web gpu tui svg png (= kernel client codes 0..4)
# Rendered into spec/SPEC.md §"Platform support" by `xtask support-md`;
# `xtask gen-caps` emits crates/slab-kernel/src/caps.rs.

[feature.radius]
web = "full"
gpu = "full"
tui = "degraded:corner radius collapses to single arc glyphs (radius >= 4u draws ╭ ╮ ╰ ╯, smaller radii draw square corners)"
svg = "full"
png = "full"

[feature.shadow]
web = "full"
gpu = "degraded:outset shadows use blurred-SDF approximations"
tui = "none:cap-shadow"
svg = "degraded:the shadow spread field is ignored by the SVG filters (research parity; the raster honors it)"
png = "full"

[feature.blur]
web = "full"
gpu = "full"
tui = "none:cap-blur"
svg = "full"
png = "full"

[feature.backdrop]
web = "full"
gpu = "full"
tui = "none:cap-backdrop"
svg = "degraded:approximated by re-emitting the ops beneath the panel, clipped and blurred, behind it"
png = "full"

[feature.gradient]
web = "degraded:dashed or per-side gradient strokes fall back to their first stop"
gpu = "degraded:gradients sample at most 8 stops (cap-gradient-stops)"
tui = "degraded:sampled per cell (linear angle, radial farthest-corner, conic sweep), alpha-composited"
svg = "full"
png = "full"

[feature.gradient-conic]
web = "full"
gpu = "degraded:gradients sample at most 8 stops (cap-gradient-stops)"
tui = "degraded:sampled per cell over the paint box"
svg = "degraded:approximated by a 90-wedge fan, each wedge solid at its center sample"
png = "full"

