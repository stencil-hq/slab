png = "full"

[feature.text-raster]
web = "degraded:browser-rasterized glyphs; kernel line breaks and advances are authoritative"
gpu = "full"
tui = "degraded:wide clusters (EAW W/F, emoji presentation) occupy two cells; runs re-quantize to columns under the real font metrics"
svg = "degraded:viewer-rasterized glyphs; textLength force-fits each run to the kernel-measured width"
png = "full"
