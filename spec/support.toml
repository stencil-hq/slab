# Includes Activate/Change/Submit plus Press, Context, Dblclick, DragStart,
# Drop, Resize, PointerMove, PointerUp, DragUpdate, and DragEnd with the shared
# typed SignalMeta payload. `drag-ghost` is a paint-only 0.72-opacity duplicate
# emitted through ordinary Group/draw ops; it adds no scene, hit, or a11y node.
[feature.signals]
web = "full"
gpu = "full"
tui = "full"
svg = "none:cap-signal"
png = "none:cap-signal"

# Web maps the retained hierarchy to ARIA; native GPU windows publish it through
# AccessKit. TUI and static visual exports retain kernel scene metadata for
# programmatic consumers but do not expose a platform accessibility tree.
[feature.a11y]
web = "full"
gpu = "full"
tui = "none:cap-a11y"
svg = "none:cap-a11y"
png = "none:cap-a11y"

[feature.text-edit]
web = "full"
gpu = "degraded:cut/copy/paste do not reach the system clipboard (winit has no clipboard API)"
tui = "full"
