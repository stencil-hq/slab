[feature.holes]
# Web slots and GPU/native HoleContent report natural content size for hug
# axes. Hostless TUI and static SVG/PNG make no report, so hug starts at zero
# and then uses the ordinary min/max clamps.
web = "full"
gpu = "full"
tui = "none:cap-hole"
svg = "degraded:the hole box renders empty; a hug axis has no host report, so it uses zero before ordinary min/max clamps"
png = "degraded:the hole box renders empty; a hug axis has no host report, so it uses zero before ordinary min/max clamps"

