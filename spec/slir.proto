syntax = "proto3";

package slir;

message Doc {
  bool ok = 1;
  repeated string errs = 2;
  repeated string strs = 3;
  repeated uint32 node_kind = 4;
  repeated uint32 node_flags = 5;
  repeated uint32 node_parent = 6;
  repeated uint32 node_first = 7;
  repeated uint32 node_next = 8;
  repeated uint32 node_key = 9;
  repeated uint32 node_id = 10;
  repeated uint32 node_line = 11;
  repeated uint32 aval_tag = 12;
  repeated uint32 aval_lo = 13;
  repeated uint32 aval_hi = 14;
  repeated double aval_num = 15;
  repeated double f64s = 16;
  repeated uint32 grad_kind = 17;
  repeated double grad_angle = 18;
  repeated int32 grad_stop_off = 19;
  repeated int32 grad_stop_len = 20;
  repeated double grad_stop_pos = 21;
  repeated uint32 grad_stop_rgba = 22;
  repeated double shdw_x = 23;
  repeated double shdw_y = 24;
  repeated double shdw_blur = 25;
  repeated double shdw_spread = 26;
  repeated uint32 shdw_rgba = 27;
  repeated uint32 shdw_inset = 28;
  repeated int32 attr_index = 29;
  repeated uint32 attr_id = 30;
  repeated uint32 attr_val = 31;
  repeated int32 path_verb_off = 32;
  repeated int32 path_verb_len = 33;
  repeated int32 path_coord_off = 34;
  repeated int32 path_coord_len = 35;
  repeated uint32 path_verbs = 36;
  repeated double path_coords = 37;
  repeated uint32 font_family = 38;
  repeated uint32 font_class = 39;
  repeated uint32 font_weight = 40;
  repeated uint32 font_upem = 41;
  repeated int32 font_ascent = 42;
  repeated int32 font_descent = 43;
  repeated int32 font_line_gap = 44;
  repeated uint32 font_default_adv = 45;
  repeated int32 font_cmap_off = 46;
  repeated int32 font_cmap_len = 47;
  repeated uint32 font_cmap_cp = 48;
  repeated uint32 font_cmap_gid = 49;
  repeated uint32 font_adv = 50;
  repeated uint32 cond_kind = 51;
  repeated uint32 cond_neg = 52;
  repeated uint32 cond_op = 53;
  repeated double cond_num = 54;
  repeated uint32 cond_sym = 55;
  repeated uint32 patch_node = 56;
  repeated uint32 patch_cond = 57;
  repeated int32 patch_attr_off = 58;
  repeated int32 patch_attr_len = 59;
  repeated int32 patch_child_off = 60;
  repeated int32 patch_child_len = 61;
  repeated uint32 wattr_id = 62;
  repeated uint32 wattr_val = 63;
  repeated uint32 patch_children = 64;
  repeated uint32 anim_name = 65;
  repeated int32 anim_stop_off = 66;
  repeated int32 anim_stop_len = 67;
  repeated double anim_stop_pos = 68;
  repeated int32 anim_stop_attr_off = 69;
  repeated int32 anim_stop_attr_len = 70;
  repeated uint32 aattr_id = 71;
  repeated uint32 aattr_val = 72;
  repeated uint32 bind_node = 73;
  repeated uint32 bind_anim = 74;
  repeated double bind_dur = 75;
  repeated uint32 bind_mode = 76;
  repeated uint32 bind_easing = 77;
  repeated double bind_delay = 78;
  repeated uint32 trans_node = 79;
  repeated uint32 trans_easing = 80;
  repeated double trans_dur = 81;
  repeated double trans_delay = 82;
  repeated uint32 parm_name = 83;
  repeated uint32 parm_type = 84;
  repeated uint32 parm_default = 85;
  repeated int32 parm_enum_off = 86;
  repeated int32 parm_enum_len = 87;
  repeated int32 parm_site_off = 88;
  repeated int32 parm_site_len = 89;
  repeated uint32 parm_enum_syms = 90;
  repeated uint32 parm_site_node = 91;
  repeated uint32 parm_site_attr = 92;
  repeated uint32 list_param = 93;
  repeated int32 list_field_off = 94;
  repeated int32 list_field_len = 95;
  repeated uint32 list_field_name = 96;
  repeated uint32 list_field_type = 97;
  repeated uint32 list_field_default = 98;
  repeated int32 list_field_enum_off = 99;
  repeated int32 list_field_enum_len = 100;
  repeated uint32 list_enum_syms = 101;
  repeated int32 list_item_field_off = 102;
  repeated int32 list_item_field_len = 103;
  repeated uint32 list_item_value_field = 104;
  repeated uint32 list_item_value_val = 105;
  repeated uint32 theme_name = 106;
  repeated uint32 hole_name = 107;
  repeated uint32 hole_node = 108;
  repeated uint32 sign_name = 109;
  repeated uint32 sign_node = 110;
