  // 4 context, 5 dblclick, 6 drag-start, 7 drop, 8 resize, 9 pointer-move,
  // 10 pointer-up, 11 drag-update, 12 drag-end, 13 typed-keys activate,
  // 14 cancel (escape-blur discard; carries the retained buffer text).
  repeated uint32 sign_trigger = 111;
  repeated uint32 img_src = 112;
  repeated uint32 img_w = 113;
  repeated uint32 img_h = 114;
  repeated uint32 img_format = 115;
  repeated bytes img_data = 116;
  repeated uint32 tup_dyn_tag = 117;
  repeated double tup_dyn_num = 118;
  repeated uint32 tup_dyn_param = 119;
  repeated uint32 list_field_sub = 120; // 0 scalar, n+1 nested list-schema row
  repeated uint32 icon_name = 121; // STRS ref
  repeated uint32 icon_node = 122; // detached subtree root
  repeated double icon_viewbox = 123; // square design-box size, default 24
  repeated uint32 token_name = 130; // STRS ref, dotted path
  repeated uint32 token_base = 131; // AVAL ref
  repeated int32 token_theme_off = 132; // slice into `token_theme_name/val`
  repeated int32 token_theme_len = 133;
  repeated uint32 token_theme_name = 134; // STRS ref
  repeated uint32 token_theme_val = 135; // AVAL ref
  repeated uint32 token_base_repr = 136; // STRS ref, canonical host text
  repeated uint32 token_theme_repr = 137; // STRS ref parallel to `token_theme_val`
  repeated int32 font_underline_position = 138;
  repeated int32 font_underline_thickness = 139;
  repeated int32 font_data_off = 140;
  repeated int32 font_data_len = 141;
  bytes font_data = 142; // sfnt bytes sliced by `font_data_off`/`font_data_len`
}
